<div class="wrap">
  <nav>
    <a class="logo" routerLink="/"><i>w</i>WBSKT</a>
    <span class="links">
      <a routerLink="/features" routerLinkActive="on">Features</a>
      <a routerLink="/" fragment="ideas">Ideas</a>
      <a routerLink="/get-started" routerLinkActive="on">Get started</a>
      <a routerLink="/docs" routerLinkActive="on">Docs</a>
      <a [href]="links.github">GitHub</a>
    </span>
    <span class="sp"></span>
    <a class="login" [href]="links.login">Log in</a>
    <a class="btn" [href]="links.signup">Start free</a>
    <button
      class="burger"
      type="button"
      [attr.aria-expanded]="open()"
      aria-label="Menu"
      (click)="open.set(!open())"
      [innerHTML]="open() ? closeIcon : menuIcon"
    ></button>
  </nav>
</div>
<div class="mnav" [class.open]="open()">
  <a routerLink="/features">Features</a>
  <a routerLink="/" fragment="ideas">Ideas</a>
  <a routerLink="/get-started">Get started</a>
  <a routerLink="/docs">Docs</a>
  <a [href]="links.github">GitHub</a>
  <a [href]="links.login">Log in</a>
  <a class="btn" [href]="links.signup">Start free</a>
</div>
