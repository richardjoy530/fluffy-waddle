name: Docs coverage

# Checks the product docs against wbskt/Wbskt master: every node kind has a page and every API error
# code is documented. A pull request that leaves a gap fails; the weekly run files an issue for gaps
# the backend opened since.

on:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the site
        uses: actions/checkout@v4

      - name: Checkout the backend
        uses: actions/checkout@v4
        with:
          repository: wbskt/Wbskt
          ref: master
          path: wbskt-backend

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the docs
        id: check
        run: node scripts/docs-coverage.mjs wbskt-backend

      - name: File an issue for the gaps
        if: failure() && steps.check.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Product docs are behind the backend"
          node scripts/docs-coverage.mjs wbskt-backend --markdown > report.md || true
          {
            echo "The weekly docs coverage run found what the docs don't cover yet, against wbskt/Wbskt master."
            echo
            cat report.md
            echo
            echo "Document each one, or add it to \`scripts/docs-coverage-ignore.json\` with the reason. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > body.md
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
